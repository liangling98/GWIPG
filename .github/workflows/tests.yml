name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[examples,dev]"
      - run: ruff check src examples tests
      - run: ruff format --check src examples tests
      - run: python -m pytest
      - run: python examples/quickstart.py
      - run: gwipg-paper graph --quick
      - run: gwipg-paper spheres --quick
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - name: Verify import outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -c "from gwipg import gwipg, proj_transport_polytope; print('Wheel imports successfully')"
