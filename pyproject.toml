[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gwipg"
version = "0.1.0"
description = "Inexact projected gradient methods for Gromov-Wasserstein optimal transport"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "GWIPG contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "POT>=0.9.6,<0.10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/liangling98/GWIPG"
Issues = "https://github.com/liangling98/GWIPG/issues"

[project.optional-dependencies]
examples = ["pandas>=2.0", "matplotlib>=3.7", "networkx>=3.0", "scikit-learn>=1.3", "tabulate>=0.9", "psutil>=5.9"]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.2", "ruff>=0.11", "twine>=5"]

[project.scripts]
gwipg-graph = "gwipg.benchmarks.graph_alignment:main"
gwipg-snare = "gwipg.benchmarks.snare_seq:main"
gwipg-spheres = "gwipg.benchmarks.spheres:main"
gwipg-projection-cost = "gwipg.benchmarks.projection_cost:main"
gwipg-inner-accuracy = "gwipg.benchmarks.inner_accuracy:main"
gwipg-lowrank = "gwipg.benchmarks.lowrank:main"
gwipg-paper = "gwipg.benchmarks.paper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gwipg.benchmarks" = ["paper_presets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
